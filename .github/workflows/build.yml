name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner image already ships an Android SDK. The
      # android-actions/setup-android action is not used on purpose:
      # its bundled sdkmanager invocation tries to install the removed
      # legacy 'tools' package and fails on current SDK repositories.
      - name: Install SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0"

      - name: Check web assets syntax
        run: node --check IMEService/src/main/res/raw/ime_core.js

      - name: Build debug and release APKs
        run: ./gradlew :IMEService:assembleDebug :IMEService:assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tvremoteime-apks
          path: |
            IMEService/build/outputs/apk/debug/*.apk
            IMEService/build/outputs/apk/release/*.apk
          if-no-files-found: error
