name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Check web assets syntax
        run: node --check IMEService/src/main/res/raw/ime_core.js

      - name: Build debug and release APKs
        run: ./gradlew :IMEService:assembleDebug :IMEService:assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tvremoteime-apks
          path: |
            IMEService/build/outputs/apk/debug/*.apk
            IMEService/build/outputs/apk/release/*.apk
          if-no-files-found: error
