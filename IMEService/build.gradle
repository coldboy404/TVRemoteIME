plugins {
    id 'com.android.application'
}

android {
    namespace 'com.android.tvremoteime'
    compileSdk 36
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId 'com.android.tvremoteime'
        minSdk 21
        targetSdk 36
        versionCode 19
        versionName "2.1.6"
    }

    // Release signing is driven by environment variables so the keystore can
    // live in GitHub Secrets (see .github/workflows/release.yml). When the env
    // vars are absent (local dev, PR CI) the release build stays unsigned.
    signingConfigs {
        release {
            def ksPath = System.getenv("RELEASE_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
                v1SigningEnabled true
                v2SigningEnabled true
                v3SigningEnabled true
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            if (System.getenv("RELEASE_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../proguard-project.txt'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(path: ':AdbLib')
    implementation project(path: ':DroidDLNA')
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
}
